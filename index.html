  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var match = path.match(/^\/(ru|en|ka)(?:\/|$)/);
        var lang = match ? match[1] : null;
        if (!lang) {
          var cookieMatch = document.cookie.match(/(?:^|; )i18next=([^;]*)/);
          if (cookieMatch) {
            lang = decodeURIComponent(cookieMatch[1]);
          }
        }
        if (!lang) {
          var stored = localStorage.getItem('app_language');
          if (stored && (stored === 'ru' || stored === 'en' || stored === 'ka')) {
            lang = stored;
          }
        }
        if (!lang) {
          var nav = (navigator.language || '').toLowerCase();
          if (nav.startsWith('ru')) lang = 'ru';
          else if (nav.startsWith('ka')) lang = 'ka';
          else if (nav.startsWith('en')) lang = 'en';
          else lang = 'ru';
        }
        if (lang) {
          document.documentElement.lang = lang;
        }
      } catch (e) {}
    })();
  </script>

<body>
  <div id="root"></div>
  <script>
    (function () {
      if (!/^\/partners(\/|$)/.test(window.location.pathname)) return;

      var root = document.getElementById('root');
      if (!root) return;

      var boot = document.createElement('div');
      boot.id = 'md-boot';
      boot.style.cssText = 'min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#151514;color:#9ca3af;font:600 14px/1.4 -apple-system,system-ui,sans-serif;padding:24px;text-align:center';
      boot.textContent = 'Загрузка Partners…';
      root.appendChild(boot);

      function clearBoot() {
        var el = document.getElementById('md-boot');
        if (el) el.remove();
      }

      if (window.MutationObserver) {
        var mo = new MutationObserver(function () {
          if (!document.getElementById('md-boot')) { mo.disconnect(); return; }
          if (root.childElementCount > 1 || (root.firstElementChild && root.firstElementChild.id !== 'md-boot')) {
            clearBoot();
            mo.disconnect();
          }
        });
        mo.observe(root, { childList: true, subtree: true });
      }

      setTimeout(function () {
        var el = document.getElementById('md-boot');
        if (!el) return;
        el.innerHTML = 'Не удалось загрузить приложение.<br/>Закройте и откройте снова.<br/><span style="opacity:.6;font-size:12px">boot timeout</span>';
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg && tg.ready) tg.ready();
          if (tg && tg.expand) tg.expand();
        } catch (e) {}
      }, 12000);

      window.addEventListener('error', function (ev) {
        var el = document.getElementById('md-boot');
        if (!el) return;
        var msg = (ev && ev.message) ? String(ev.message) : 'script error';
        el.innerHTML = 'Ошибка загрузки:<br/>' + msg.replace(/[<>]/g, '');
      });
    })();
  </script>
