<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MestiDelivery — Официальные промо-баннеры (1280 × 446)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #21EA7C;
      --bg: #07080a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 680px;
    }
    .header h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
    }
    .banners-container {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .banner-card-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .banner-tag {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.45);
      padding-left: 4px;
    }
    .banner-frame {
      width: 100%;
      aspect-ratio: 1280 / 446;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
    }
    .banner-frame:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 48px rgba(0,0,0,0.75), 0 0 30px rgba(33, 234, 124, 0.2);
      border-color: rgba(33, 234, 124, 0.4);
    }
    .banner-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>MestiDelivery — Промо-баннеры</h1>
    <p>Формат 1280 × 446 px • Точно под карусель сайта</p>
  </div>

  <div class="banners-container">
    <div class="banner-card-wrap">
      <div class="banner-tag">Баннер 1: Промокод / Скидка на первый заказ</div>
      <div class="banner-frame">
        <img src="./Assets/banner_ru.jpeg" alt="Скидка 10₾ на первый заказ">
      </div>
    </div>

    <div class="banner-card-wrap">
      <div class="banner-tag">Баннер 2: Реферальная программа / Приведи друга</div>
      <div class="banner-frame">
        <img src="./Assets/ref_banner_ru.jpeg" alt="Приведи друга — забирай 10%!">
      </div>
    </div>
  </div>
</body>
</html>
